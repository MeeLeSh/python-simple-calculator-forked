
[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", "venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # Ошибки стиля pycodestyle
    "F",    # Ошибки Pyflakes
    "W",    # Предупреждения pycodestyle
    "I",    # Порядок импортов
    "B",    # Потенциальные ошибки и плохие практики
    "UP",   # Современные конструкции Python
]
ignore = []

[tool.black]
line-length = 88
target-version = ["py311"]
exclude = '''
/(
    \.git
    | \.venv
    | build
    | dist
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
